name: Check release secrets
run-name: 检查发布 secrets · ${{ github.ref_name }}

# 手动检查发布用 secrets 是否可用，不修改任何仓库：配置或轮换令牌后运行一次。
#   gh workflow run check-secrets.yml
# GitHub 不允许读回 secret，只能这样实际验证；未配置的项标为跳过，配置了但不可用的项让任务失败。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check secrets
        run: |
          failed=0
          ok() { echo "✅ $1"; }
          bad() { echo "::error::$1"; failed=1; }
          skip() { echo "⏭️ $1 未配置"; }

          # TAP_TOKEN：push --dry-run 会向服务端请求 receive-pack，只有具备写权限的令牌才能通过，且不会推送任何内容。
          if [ -n "$TAP_TOKEN" ]; then
            git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/bitdan/homebrew-snap-desk.git" tap \
              && git -C tap push --dry-run -q origin HEAD 2>/dev/null \
              && ok 'TAP_TOKEN 可以写入 bitdan/homebrew-snap-desk' \
              || bad 'TAP_TOKEN 无法写入 bitdan/homebrew-snap-desk（令牌错误、过期，或缺少 Contents: Read and write）'
          else skip TAP_TOKEN; fi

          # macOS 签名：用密码解开 .p12，并核对证书与仓库里的公钥一致、通用名正确。
          if [ -n "$MACOS_SIGNING_CERTIFICATE" ]; then
            printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 -d > cert.p12
            if openssl pkcs12 -in cert.p12 -nokeys -clcerts -passin env:MACOS_SIGNING_CERTIFICATE_PASSWORD -out cert.pem 2>/dev/null; then
              actual=$(openssl x509 -in cert.pem -noout -fingerprint -sha256)
              expected=$(openssl x509 -in resources/macos-signing.pem -noout -fingerprint -sha256)
              subject=$(openssl x509 -in cert.pem -noout -subject)
              if [ "$actual" = "$expected" ] && echo "$subject" | grep -q 'CN *= *Snap Desk Self-Signed'; then
                ok "macOS 签名证书可用（$(openssl x509 -in cert.pem -noout -enddate)）"
              else
                bad 'MACOS_SIGNING_CERTIFICATE 与 resources/macos-signing.pem 不是同一张证书'
              fi
            else
              bad 'MACOS_SIGNING_CERTIFICATE 无法用 MACOS_SIGNING_CERTIFICATE_PASSWORD 解开'
            fi
            rm -f cert.p12 cert.pem
          else skip MACOS_SIGNING_CERTIFICATE; fi

          # WINGET_TOKEN：能读到当前用户即说明令牌有效；wingetcreate 还需要 public_repo 权限。
          if [ -n "$WINGET_TOKEN" ]; then
            scopes=$(curl -sS -o /dev/null -D - -H "Authorization: Bearer $WINGET_TOKEN" https://api.github.com/user | tr -d '\r' | sed -n 's/^x-oauth-scopes: //Ip')
            case ",$scopes," in
              *public_repo*|*,repo,*) ok "WINGET_TOKEN 有效（scopes: $scopes）" ;;
              *) bad "WINGET_TOKEN 无效或缺少 public_repo（scopes: ${scopes:-无}）" ;;
            esac
          else skip WINGET_TOKEN; fi

          # AUR：用私钥登录 aur.archlinux.org，认证成功时服务端会回复欢迎信息。
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
            ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
            if ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes aur@aur.archlinux.org help 2>&1 | grep -qi 'commands'; then
              ok 'AUR_SSH_PRIVATE_KEY 可以登录 AUR'
            else
              bad 'AUR_SSH_PRIVATE_KEY 无法登录 AUR（公钥未添加到 AUR 账号）'
            fi
            rm -f ~/.ssh/aur
          else skip AUR_SSH_PRIVATE_KEY; fi

          exit $failed
