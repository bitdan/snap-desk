name: Release Windows
run-name: ${{ contains(github.ref_name, '-') && '测试版' || '正式版' }} · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

# 同一个标签只运行一条发布流水线，避免重复上传附件。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: Windows x64 executable and installers
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify embedded model catalog and published files
        run: |
          python scripts/ci/generate-model-catalog.py --check --remote
          if ($LASTEXITCODE -ne 0) { throw '内置模型目录或发布附件验证失败' }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # 先从 package.json 同步版本，再执行 npm ci 和 Cargo --locked。
      - name: Check tag and sync version
        run: node scripts/check-release-version.mjs

      # 标签注释是更新内容的唯一来源，缺失时在构建前停止；正文同时用于应用内更新清单。
      - name: Prepare release notes from tag
        run: node scripts/release-notes.mjs $env:GITHUB_REF_NAME "$env:RUNNER_TEMP/snap-desk-release-notes.md"

      # Windows runner 已安装 rustup 和 MSVC；显式选择 x64 MSVC stable 工具链。
      - name: Setup Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      # target 相对 src-tauri 解析，与本地构建脚本固定的缓存目录一致。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # 先校验密钥/密码及公钥匹配，避免 Rust 构建十几分钟后才发现签名配置错误。
      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SNAP_DESK_UPDATER_PUBLIC_KEY: ${{ vars.SNAP_DESK_UPDATER_PUBLIC_KEY }}
        run: node scripts/release-signing.mjs

      # 测试失败时停止发布；Rust 默认跳过需要实机桌面或模型资源的 ignored 测试。
      - name: Test frontend
        run: npm test

      - name: Test native library
        working-directory: src-tauri
        run: cargo test --locked --lib

      # 复用本地脚本的 --ci、--locked 和 src-tauri/target 输出目录。
      - name: Build executable and installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SNAP_DESK_UPDATER_PUBLIC_KEY: ${{ vars.SNAP_DESK_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:SNAP_DESK_UPDATER_PUBLIC_KEY) {
            throw '请配置 TAURI_SIGNING_PRIVATE_KEY Secret 和 SNAP_DESK_UPDATER_PUBLIC_KEY Variable。'
          }
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/publish-release.ps1 -Tag $env:GITHUB_REF_NAME -NotesFile "$env:RUNNER_TEMP/snap-desk-release-notes.md"
