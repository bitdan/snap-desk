name: Release Windows
run-name: ${{ contains(github.ref_name, '-') && '测试版' || '正式版' }} · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

# 同一个标签只运行一条发布流水线，避免重复上传附件。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: Windows x64 executable and installers
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 与模型流水线共用受审版本和 ZIP 摘要；锁未填写时尽早失败。
      - name: Download and verify required translator runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/ci/download-translator-runtime.ps1

      - name: Verify embedded model catalog and published files
        run: |
          python scripts/ci/generate-model-catalog.py --check --remote
          if ($LASTEXITCODE -ne 0) { throw '内置模型目录或发布附件验证失败' }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # 先从 package.json 同步版本，再执行 npm ci 和 Cargo --locked。
      - name: Check tag and sync version
        run: node scripts/check-release-version.mjs

      # Windows runner 已安装 rustup 和 MSVC；显式选择 x64 MSVC stable 工具链。
      - name: Setup Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      # target 相对 src-tauri 解析，与本地构建脚本固定的缓存目录一致。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # 复用本地脚本的 --ci、--locked 和 src-tauri/target 输出目录。
      - name: Build executable and installers
        env:
          SNAP_DESK_REQUIRE_TRANSLATION: '1'
        run: npm run desktop:package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 测试版只收集 NSIS，避免读取不存在的 MSI 目录或上传旧 MSI。
          $isTestRelease = $env:GITHUB_REF_NAME.Contains('-')
          $installers = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File
          )
          if ($installers.Count -ne 1) {
            throw '应生成一个 NSIS EXE 安装包，请检查构建输出。'
          }
          if (-not $isTestRelease) {
            $msi = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -File)
            if ($msi.Count -ne 1) {
              throw '正式版应额外生成一个 MSI 安装包，请检查构建输出。'
            }
            $installers += $msi
          }
          # 打包本身已经生成主程序，无需再编译；复制并命名以区别于 *-setup.exe。
          $executable = 'src-tauri/target/release/snap-desk.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw '缺少可运行的 snap-desk.exe，请检查构建输出。'
          }
          $standalone = "src-tauri/target/release/snap-desk-$env:GITHUB_REF_NAME-windows-x64-standalone.exe"
          Copy-Item -LiteralPath $executable -Destination $standalone
          # 过渡期仍保留裸 EXE；明确说明资源限制，不宣称它是完整便携版。
          $engine = Get-Content scripts/ci/translation-engine.json -Raw | ConvertFrom-Json
          $notes = @(
            "Translation engine: $($engine.tag) (Windows x64 CPU, protocol 1).",
            'NSIS/MSI include the translation runtime and third-party licenses; models are downloaded/imported separately.',
            'The standalone EXE does NOT include the local translation runtime. Use an installer for local translation.',
            'Model sources and licenses are recorded in each model pack.json and LICENSE.txt.'
          )
          $notes | Set-Content src-tauri/target/release/translation-release-notes.txt -Encoding utf8
          # 版本后缀决定发布渠道；校验步骤已确保标签符合版本格式。
          $channel = if ($isTestRelease) { '测试版' } else { '正式版' }
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '--verify-tag', '--title', "Snap Desk $env:GITHUB_REF_NAME（$channel）",
            '--generate-notes', '--notes-file', 'src-tauri/target/release/translation-release-notes.txt'
          )
          # v0.2.0-beta.1 等标签发布为预发布版本，不设为 Latest。
          if ($isTestRelease) {
            $releaseArgs += @('--prerelease', '--latest=false')
          } else {
            $releaseArgs += '--latest'
          }
          $releaseArgs += $installers.FullName
          # 单独分发主程序时一并提供许可证；它仍需要系统已安装 WebView2。
          $releaseArgs += @($standalone, 'LICENSE')
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
