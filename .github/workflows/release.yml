name: Release Windows
run-name: ${{ contains(github.ref_name, '-') && '测试版' || '正式版' }} · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

# 同一个标签只运行一条发布流水线，避免重复上传附件。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: Windows x64 executable and installers
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify embedded model catalog and published files
        run: |
          python scripts/ci/generate-model-catalog.py --check --remote
          if ($LASTEXITCODE -ne 0) { throw '内置模型目录或发布附件验证失败' }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # 先从 package.json 同步版本，再执行 npm ci 和 Cargo --locked。
      - name: Check tag and sync version
        run: node scripts/check-release-version.mjs

      # Windows runner 已安装 rustup 和 MSVC；显式选择 x64 MSVC stable 工具链。
      - name: Setup Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc

      # target 相对 src-tauri 解析，与本地构建脚本固定的缓存目录一致。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # 测试失败时停止发布；Rust 默认跳过需要实机桌面或模型资源的 ignored 测试。
      - name: Test frontend
        run: npm test

      - name: Test native library
        working-directory: src-tauri
        run: cargo test --locked --lib

      # 复用本地脚本的 --ci、--locked 和 src-tauri/target 输出目录。
      - name: Build executable and installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SNAP_DESK_UPDATER_PUBLIC_KEY: ${{ vars.SNAP_DESK_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:SNAP_DESK_UPDATER_PUBLIC_KEY) {
            throw '请配置 TAURI_SIGNING_PRIVATE_KEY Secret 和 SNAP_DESK_UPDATER_PUBLIC_KEY Variable。'
          }
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 统一分发 NSIS 安装包和独立 EXE，分别生成对应的签名与更新目标。
          $isTestRelease = $env:GITHUB_REF_NAME.Contains('-')
          $installers = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File
          )
          if ($installers.Count -ne 1) {
            throw '应生成一个 NSIS EXE 安装包，请检查构建输出。'
          }
          # 打包本身已经生成主程序，无需再编译；复制并命名以区别于 *-setup.exe。
          $executable = 'src-tauri/target/release/snap-desk.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw '缺少可运行的 snap-desk.exe，请检查构建输出。'
          }
          $standalone = "src-tauri/target/release/snap-desk-$env:GITHUB_REF_NAME-windows-x64-standalone.exe"
          Copy-Item -LiteralPath $executable -Destination $standalone
          # 独立 EXE 与安装包同样绑定应用版本并签名，客户端验签后才替换文件。
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version $version $standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 过渡期仍保留裸 EXE；明确说明资源限制，不宣称它是完整便携版。
          $engine = Get-Content scripts/ci/translation-engine.json -Raw | ConvertFrom-Json
          $notes = @(
            "Translation engine: $($engine.tag) (Windows x64 CPU, protocol 1).",
            'Download or import the translation engine ZIP and language packs in Recognition & Translation settings.',
            'NSIS and standalone EXE use the same on-demand translation resources; no runtime is bundled.',
            'Model sources and licenses are recorded in each model pack.json and LICENSE.txt.'
          )
          $notes | Set-Content src-tauri/target/release/translation-release-notes.txt -Encoding utf8
          # 版本后缀决定发布渠道；校验步骤已确保标签符合版本格式。
          $channel = if ($isTestRelease) { '测试版' } else { '正式版' }
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME, '--draft',
            '--verify-tag', '--title', "Snap Desk $env:GITHUB_REF_NAME（$channel）",
            '--generate-notes', '--notes-file', 'src-tauri/target/release/translation-release-notes.txt'
          )
          # v0.2.0-beta.1 等标签发布为预发布版本，不设为 Latest。
          if ($isTestRelease) {
            $releaseArgs += '--prerelease'
          }
          $releaseArgs += $installers.FullName
          # 单独分发主程序时一并提供许可证；它仍需要系统已安装 WebView2。
          $releaseArgs += @($standalone, 'LICENSE')
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 先上传全部签名和清单，再公开 Release；失败只留下草稿，客户端不会看到半成品。
          $releaseBody = gh release view $env:GITHUB_REF_NAME --json body --jq '.body'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notesPath = 'src-tauri/target/release/update-release-notes.txt'
          $releaseBody | Set-Content $notesPath -Encoding utf8
          $manifest = 'src-tauri/target/release/updater.json'
          node scripts/windows-update.mjs $installers[0].FullName $standalone $notesPath $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signatures = @($installers | ForEach-Object { "$($_.FullName).sig" }) + "$standalone.sig"
          gh release upload $env:GITHUB_REF_NAME $manifest @signatures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latest = if ($isTestRelease) { '--latest=false' } else { '--latest' }
          gh release edit $env:GITHUB_REF_NAME --draft=false $latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
