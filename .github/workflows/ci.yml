name: CI

# 分支推送与 PR 跑检查；标签推送交给发布流水线，避免同一标签重复执行。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  frontend:
    name: Frontend checks and tests
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # release-notes 测试会读取已有附注标签；默认浅克隆没有标签，必须取完整历史。
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # check 覆盖目录边界、IPC 契约和 vue-tsc；test 覆盖 vitest 与脚本测试。
      - name: Static checks
        run: npm run check
      - name: Frontend tests
        run: npm test

  # 三个发布平台都编译并跑单元测试；非 Windows 的平台分支只有在这里才会被编译到。
  native:
    name: Native library tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS arm64
            os: macos-15
          - name: Linux x64
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # 与发布流水线使用同一条命令；默认跳过需要实机桌面或模型资源的 ignored 测试。
      - name: Test native library
        working-directory: src-tauri
        run: cargo test --locked --lib