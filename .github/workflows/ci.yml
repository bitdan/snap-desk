name: CI

# 分支推送与 PR 跑检查；标签推送交给发布流水线，避免同一标签重复执行。
# 只改文档、官网页面或许可文本的提交不影响构建和测试，整条流水线不触发；
# 测试与构建都不读取这些文件，同时改了代码的提交仍会照常运行。
# 只改发版脚本（scripts/*.mjs、package.json）也不需要编译 Rust，由 scripts.yml 负责测试。
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'scripts/*.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'scripts/*.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  # 发版与打包脚本的测试在 scripts.yml，按路径单独触发。
  # 三个发布平台都编译并跑单元测试；非 Windows 的平台分支只有在这里才会被编译到。
  native:
    name: Native library tests (${{ matrix.name }})
    # 发版准备只改版本号，随后推送的标签会在发布流水线里跑同一套测试，这里不重复。
    # master 只接受 PR，因此三种情况都要跳过：标题为 chore(release): 的发版 PR、
    # 合并它产生的合并提交（正文带 PR 标题），以及直接以该前缀开头的提交。
    if: >-
      ${{ !(startsWith(github.event.pull_request.title, 'chore(release):')
      || startsWith(github.event.head_commit.message, 'chore(release):')
      || (startsWith(github.event.head_commit.message, 'Merge pull request ')
      && contains(github.event.head_commit.message, 'chore(release):'))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS arm64
            os: macos-15
          # 与发布流水线一致在 22.04 上构建测试，标签构建才能复用这里的缓存。
          - name: Linux x64
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # 只读源码、不编译，放在最前面尽早失败；平台无关，Linux 跑一次即可。runner 自带 Node。
      - name: Check snap-core boundary and embedded resources
        if: runner.os == 'Linux'
        run: node scripts/check-architecture.mjs
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # 只在 master 推送时保存：PR 缓存内容与 master 相同却各占约 1 GB，会挤掉 master 的缓存。
      # shared-key 与发布流水线一致，标签构建可直接复用 master 的测试编译结果。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: native
          # 与发布流水线相同的镜像区分键：不同 Ubuntu 版本的构建脚本不能混用。
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # 与发布流水线使用同一条命令（snap-core、GPUI 应用与签名工具）；单元测试不打开窗口，
      # 默认跳过需要实机桌面或模型资源的 ignored 测试。
      - name: Test workspace
        run: cargo test --locked --workspace